services:
    app:
        build:
            args:
                user: sammy
                uid: 1000
            context: ./
            dockerfile: Dockerfile
        image: disaster
        ports:
            - "8000:8000"
            - "8080:8080"
        environment:
            - REVERB_PORT=8080
        container_name: disaster-app
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        networks:
            - disaster

    db:
        image: mysql:latest
        container_name: disaster-db
        restart: unless-stopped
        environment:
            - MYSQL_DATABASE=${DB_DATABASE}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        networks:
            - disaster

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: disaster-phpmyadmin
        restart: unless-stopped
        ports:
            - "8888:80"
        environment:
            - PMA_HOST=db
        networks:
            - disaster

networks:
    disaster:
        driver: bridge
